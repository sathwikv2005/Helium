name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Helium
        run: |
          gcc src/*.c -O3 -o helium.exe

      - name: Run Tests
        run: |
          python tools/tester.py
